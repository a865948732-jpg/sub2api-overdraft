name: Publish sub2api-overdraft image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image version
        required: true
        type: string
        default: "0.2.0"
      publish_latest:
        description: Also update the latest tag after verification
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/sub2api-overdraft:${{ inputs.version }}
          build-args: |
            VERSION=${{ inputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Verify image identity
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/sub2api-overdraft
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          version_output="$(docker run --rm --entrypoint /app/sub2api "${IMAGE}:${EXPECTED_VERSION}" -version 2>&1)"
          printf '%s\n' "${version_output}"
          grep -Fq "Sub2API ${EXPECTED_VERSION} (commit: ${EXPECTED_COMMIT}," <<<"${version_output}"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "${IMAGE}:${EXPECTED_VERSION}")" = "linux/amd64"

      - name: Push verified version image
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/sub2api-overdraft
          VERSION: ${{ inputs.version }}
        run: docker push "${IMAGE}:${VERSION}"

      - name: Update latest tag
        if: ${{ inputs.publish_latest }}
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/sub2api-overdraft
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          docker tag "${IMAGE}:${VERSION}" "${IMAGE}:latest"
          docker push "${IMAGE}:latest"
